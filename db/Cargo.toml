[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
dotenv = "0.15.0"
log = { version = "0.4.29", features = ["std"] }
log4rs = "1.4.0"
sqlparser = "0.51"
sqlx = { version = "0.9.0", features = ["bigdecimal", "chrono", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.50.0", features = ["full"] }
walkdir = "2.5.0"

[dev-dependencies]
sqlparser = "0.51"
