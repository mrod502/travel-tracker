[package]
name = "ca"
version = "0.1.0"
edition = "2021"
description = "Certificate Authority library for node enrollment and credential verification"
license = "MIT"

[dependencies]
# Cryptographic signing
# `pkcs8` + `pem`: CA root keys are stored as PKCS#8 PEM and published trust anchors
# as SPKI PEM, so both are ordinary standard-format files rather than something only
# this repo can read — and no key material has to live in source.
ed25519-dalek = { version = "2.0", features = ["rand_core", "pkcs8", "pem"] }
# The envelope itself. `LineEnding` and the PEM label handling live on the `pkcs8`
# crate, not on the narrow re-export `ed25519-dalek` carries.
pkcs8 = { version = "0.10", features = ["pem"] }
# PEM reading (PKCS#8 private keys, SPKI public keys), pure Rust, no C dependency.
rustls-pemfile = "2.2.0"
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# Hex survives only where a human reads an identifier (error text, CLI output).
# Keys, signatures and ids are raw bytes everywhere else, and inside a JSON
# document they travel as base64 — which is what `base64` is here for.
hex = "0.4"
base64 = "0.22"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Database (optional, for RSL manager)
# `chrono` is required because revocation timestamps cross the wire as
# `TIMESTAMPTZ` and decode into `chrono::DateTime<Utc>`. `json` carries the
# published list into and out of the `revocation_status_lists` JSONB column;
# `macros` is for the `#[sqlx::test]` suites that run against a live server.
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "macros",
], optional = true }

# Tokio for async tests
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = []
database = ["sqlx"]

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
# `rsl_persistence` builds its throwaway schema from `db`'s migration corpus
# through `db::SQLX_FORWARD_MIGRATOR` — the `up` statements only. Pointing sqlx at
# the directory instead would run every `--migrate:down` block on the way up,
# because sqlx reads whole files and does not know what `--migrate:` means.
# See db/src/forward.rs.
db = { path = "../db" }
serde_json = "1.0.151"
