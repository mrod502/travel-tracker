[package]
name = "bt_mon"
version = "0.1.0"
edition = "2021"
description = "Bluetooth device monitoring library with backend abstraction"
license = "MIT"

[dependencies]
# Async runtime compatibility
tokio = { version = "1.35", features = ["sync", "rt", "macros", "time"] }
futures = "0.3"
async-trait = "0.1"

# UUID handling
uuid = { version = "1.6", features = ["v4"] }

# Data structures
dashmap = "5.5"

# Logging
log = "0.4"

# Core dependencies (feature-gated)
btleplug = { version = "0.12", optional = true }
bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }

# Mock backend (no additional dependencies beyond core)

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
env_logger = "0.10"
futures-util = "0.3"

# Each example names the backend feature it compiles against, so
# `cargo check --workspace --all-targets` skips the ones whose backend is
# not enabled instead of failing on a configured-out module.
[[example]]
name = "connect_and_read"
required-features = ["btleplug"]

[[example]]
name = "device_discovery"
required-features = ["btleplug"]

[[example]]
name = "subscribe_notifications"
required-features = ["btleplug"]

[[example]]
name = "mock_backend_demo"
required-features = ["mock"]

[features]
default = ["btleplug"]
btleplug = ["dep:btleplug"]
bluer = ["dep:bluer"]
mock = []
full = ["btleplug", "bluer", "mock"]
