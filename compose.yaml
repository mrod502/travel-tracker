networks:
  dev:
  test:
  server:
volumes:
  db-data:
  llm-home:
services:
  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    env_file: .env
    networks:
      - dev
      - server
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - ${DB_PUBLIC_PORT:-7789}:5432
  server:
    # Your application server service
    image: travel-tracker-server
    build:
      target: server
    depends_on:
      - database
    networks:
      - server
      - dev
    environment:
      DOCKER: true
    ports:
      - ${LISTEN_PORT:-8080}:8080
    # --- Bluetooth access ---
    # bluer/btleplug on Linux talk to bluetoothd over D-Bus, not raw HCI
    # sockets, so no extra capabilities are needed here — bluetoothd on
    # the host does the privileged adapter work as root.
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /run/dbus:/run/dbus
  llm:
    # LLM coding agent container (e.g., qwen, claude-code)
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Match your host user so files created in the bind-mounted
        # ./ -> /workspace aren't owned by a foreign UID. Set
        # DEV_UID/DEV_GID in .env (e.g., `id -u`/`id -g`; defaults to 1000).
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}

    container_name: llm-dev

    working_dir: /workspace

    stdin_open: true
    tty: true

    networks:
      - dev

    volumes:
      # Project - the only part of your filesystem the container can see
      - .:/workspace

      # Rust uses project-local target/, so no language cache volumes needed
      # Commented out for reference if you ever switch to CARGO_HOME volumes:
      # - cargo-mod-cache:/usr/local/cargo
      # - cargo-build-cache:/usr/local/cargo

      # Git identity + credentials, read-only. .gitconfig covers name/email
      # and any credential.helper / url.insteadOf rewrites; .ssh covers
      # key-based auth for private repositories.
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro
      - ${HOME}/.ssh:/home/dev/.ssh:ro

      # LLM agent keeps settings, auth, and session/checkpoint history
      # under its config directory, which now persists via llm-home volume.

      # /home/dev as a named volume rather than tmpfs. This persists
      # LLM agent state, settings, and conversation history across restarts.
      # Trade-off vs. tmpfs: $HOME no longer gets wiped on container
      # restart. It's still fully isolated from your host and you can
      # reset it anytime with `docker volume rm <project>_llm-home`.
      - llm-home:/home/dev

      # tmpfs is fine for pure scratch space with no ownership
      # requirements like /tmp.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

      # --- Bluetooth access ---
      # Shares the host's D-Bus socket so bluer/btleplug can reach the
      # host's bluetoothd. Both talk BlueZ's D-Bus API on Linux, not raw
      # HCI sockets, so no added capabilities are needed — the host's
      # bluetoothd (running as root there) does the privileged work.
      - /var/run/dbus:/var/run/dbus
      - /run/dbus:/run/dbus

    environment:
      HOME: /home/dev
      CARGO_HOME: /home/dev/.cargo

      # Rust environment variables
      RUST_LOG: debug
      RUST_BACKTRACE: 1

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512

    mem_limit: 8g

    cpus: 8

    command: /bin/zsh
