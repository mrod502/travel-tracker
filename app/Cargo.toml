[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.6.5", features = ["derive", "env"] }

# Configuration
toml = "0.8"

# Local crates
bt_mon = { path = "../bt_mon" }
repo = { path = "../repo" }

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Provenance: CBOR encoding
ciborium = "0.2"

# Provenance: Ed25519 signing
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# Provenance: DashMap for rate limiting
dashmap = "6.1"

# Random number generation for testing
rand = "0.8"

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
# Linux/BlueZ backend via bluer
bluer = ["bt_mon/bluer"]
