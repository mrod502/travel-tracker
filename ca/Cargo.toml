[package]
name = "ca"
version = "0.1.0"
edition = "2021"
description = "Certificate Authority library for node enrollment and credential verification"
license = "MIT"

[dependencies]
# Cryptographic signing
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Database (optional, for RSL manager)
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"], optional = true }

# Tokio for async tests
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = []
database = ["sqlx"]

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
