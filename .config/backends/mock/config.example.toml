# btmon Configuration - mock backend (testing/development, no hardware)
#
# Backend: mock (simulated Bluetooth environment)
# No physical Bluetooth adapter or permissions required.
#
# NOTE: The mock backend still requires the `mock` cargo feature at build
# time. The runtime switch (use_mock_backend below) can come from this
# config file, the --use-mock-backend flag, or BT_USE_MOCK_BACKEND=true.
# CLI values take precedence over this file.
#
# Usage:
#   cargo run --bin app --features mock \
#     -- --config-file .config/backends/mock/config.toml
#
# or:
#   cargo run --bin app --features mock \
#     -- --use-mock-backend --config-file .config/backends/mock/config.toml
#
# Copy this file to config.toml and modify as needed

# Database configuration
[database]
url = "postgres://postgres:devpassword@localhost:7789/postgres"
# Alternatively, use individual connection parameters:
# host = "localhost"
# port = 5432
# database = "travel"
# user = "btmon"
# password = "btmon"

# Logging configuration
[log]
level = "info" # Options: debug, info, warn, error

# Node configuration
[node]
id = "49bb4b0d-2645-452d-bd81-e76b65901f08" # Your node UUID

# Bluetooth configuration
[bluetooth]
# adapter_id is not used by the mock backend
use_mock_backend = true             # Use the simulated mock Bluetooth backend
scan_interval_ms = 1000             # Scan interval in milliseconds
store_raw_payload = true            # Store raw advertisement data
data_dir = "~/.btmon/data"          # Directory for node identity and state
rate_limit_ms = 15000               # Rate limit threshold in milliseconds (15s default)
fixed_location = "40.6892,-74.0445" # Optional: fixed location "lat,lon"
stream_reopen_delay_ms = 1000       # Delay (ms) before reopening a closed event stream (must be > 0)
