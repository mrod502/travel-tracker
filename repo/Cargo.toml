[package]
name = "repo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
    "macros",
] }
tokio = { version = "1.50", features = ["full"] }

# Types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v7", "serde"] }
geo-types = { version = "0.7", features = ["serde"] }

# Utilities
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
h3o = { version = "0.10.0", features = ["serde", "geo"] }
