# btmon Configuration - bluer backend (Linux/BlueZ only)
#
# Backend: bluer (Linux-specific, BlueZ/D-Bus based)
# Needs a physical Bluetooth adapter.
#
# NOT USABLE BY `app` YET. Building with --features bluer compiles bt_mon's BlueZ backend into the
# binary and selects nothing: App::run constructs btleplug or the mock, and there is no branch that
# calls create_bluer_monitor_with_config. Every setting below is read regardless of which backend
# runs; only the backend choice is missing. Until that branch exists this is a working configuration
# for a node on btleplug and nothing more — see app/README.md, "Bluetooth Backend Selection", for the
# change required.
#
# Usage:
#   cargo run --bin app -- --config-file .config/backends/bluer/config.toml
#
# Copy this file to config.toml and modify as needed

# Database configuration
[database]
url = "postgres://postgres:devpassword@localhost:7789/postgres"
# Alternatively, use individual connection parameters:
# host = "localhost"
# port = 5432
# database = "travel"
# user = "btmon"
# password = "btmon"

# Logging configuration
[log]
level = "info" # Options: debug, info, warn, error

# Node configuration
[node]
id = "49bb4b0d-2645-452d-bd81-e76b65901f08" # Your node UUID

# Bluetooth configuration
[bluetooth]
# adapter_id = "hci0"             # Optional: BlueZ adapter name (uses default adapter if unset)
scan_interval_ms = 1000             # Scan interval in milliseconds
store_raw_payload = true            # Store raw advertisement data
data_dir = "~/.btmon/data"          # Directory for node identity and state
rate_limit_ms = 15000               # Rate limit threshold in milliseconds (15s default)
fixed_location = "40.6892,-74.0445" # Optional: fixed location "lat,lon"
stream_reopen_delay_ms = 1000       # Delay (ms) before reopening a closed event stream (must be > 0)
